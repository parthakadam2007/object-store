apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: kafka
  namespace: kafka

spec:
  serviceName: kafka
  replicas: 3

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      hostname: kafka

      containers:
        - name: kafka
          image: apache/kafka:4.2.1-rc5

          ports:
            - containerPort: 9092
              name: kafka

            - containerPort: 9093
              name: controller

          command:
            - sh
            - -c
            - |
              export KAFKA_CFG_NODE_ID=${HOSTNAME##*-}
              exec /etc/kafka/docker/run

          env:
            - name: KAFKA_ENABLE_KRAFT
              value: "yes"

            - name: KAFKA_CFG_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"

            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(HOSTNAME).kafka.kafka.svc.cluster.local:9092"

            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.kafka.svc.cluster.local:9093,1@kafka-1.kafka.kafka.svc.cluster.local:9093,2@kafka-2.kafka.kafka.svc.cluster.local:9093"

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: kafka-data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 10Gi